<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title">Isha's Space Party – Geschenkwünsche 🚀</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
<style>
  :root {
    --space-deep:   #05051a;
    --purple:       #a855f7;
    --purple-light: #c084fc;
    --pink:         #e879f9;
    --cyan:         #67e8f9;
    --indigo:       #818cf8;
    --green:        #4ade80;
    --red:          #f87171;
    --text:         #e2e8f0;
    --text-muted:   #94a3b8;
    --card-bg:      rgba(255,255,255,0.04);
    --card-border:  rgba(168,85,247,0.25);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--space-deep);
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  #starfield {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 15% 15%, #110a2e 0%, #05051a 55%, #0a0d2e 100%);
    z-index: 0; pointer-events: none;
  }
  .star {
    position: absolute; border-radius: 50%; background: #fff;
    animation: twinkle var(--d,3s) ease-in-out infinite;
    animation-delay: var(--delay,0s);
  }
  @keyframes twinkle {
    0%,100% { opacity:.15; transform:scale(1); }
    50%      { opacity:1;   transform:scale(1.5); }
  }

  .nebula { position:fixed; border-radius:50%; filter:blur(80px); pointer-events:none; z-index:0; }
  .n1 { width:500px; height:500px; background:rgba(168,85,247,.07);  top:-150px; right:-150px; }
  .n2 { width:400px; height:400px; background:rgba(103,232,249,.05); bottom:-100px; left:-100px; }
  .n3 { width:300px; height:300px; background:rgba(232,121,249,.06); top:40%; left:30%; }

  .container {
    position:relative; z-index:1;
    max-width:860px; margin:0 auto;
    padding:2.5rem 1.5rem 5rem;
  }

  /* ── Language toggle ── */
  .lang-toggle {
    position:fixed; top:1rem; right:1rem; z-index:200;
    display:flex; gap:8px; align-items:center;
    background:rgba(5,5,26,.92); border:1px solid rgba(168,85,247,.45);
    border-radius:50px; padding:6px 12px;
  }
  .lang-btn {
    background:transparent; border:none; color:var(--text-muted);
    font-size:.85rem; font-weight:700; cursor:pointer;
    font-family:'Nunito',sans-serif; transition:color .2s;
    padding:2px 8px;
  }
  .lang-btn.active { color:var(--pink); }
  .lang-btn:hover { color:var(--text); }

  /* ── Header ── */
  header { text-align:center; padding-bottom:2rem; }

  .rocket-wrap {
    display:inline-block; width:140px; height:140px; margin-bottom:.6rem;
    user-select:none;
    filter: drop-shadow(0 0 18px rgba(232,121,249,.35)) drop-shadow(0 0 6px rgba(103,232,249,.25));
  }
  .rocket-wrap lottie-player { width:100%; height:100%; }

  h1 {
    font-family:'Orbitron',sans-serif;
    font-size:clamp(1.6rem,5vw,2.6rem); font-weight:900;
    letter-spacing:3px; text-transform:uppercase;
    background:linear-gradient(135deg,#f0abfc,#818cf8 40%,#67e8f9);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    margin-bottom:.35rem; line-height:1.15;
  }

  .tagline { font-size:.95rem; color:var(--indigo); font-weight:700; letter-spacing:2px; text-transform:uppercase; }

  .party-details {
    display:inline-flex; gap:1.5rem; flex-wrap:wrap; justify-content:center;
    margin-top:1.1rem;
    background:rgba(129,140,248,.08); border:1px solid rgba(129,140,248,.2);
    border-radius:50px; padding:.55rem 1.4rem;
    font-size:.82rem; color:var(--text-muted); font-weight:600;
  }
  .party-details span { display:flex; align-items:center; gap:5px; }

  .divider { text-align:center; margin:1.2rem 0; color:var(--purple-light); letter-spacing:10px; font-size:1rem; opacity:.5; }

  /* ── Hint box ── */
  .hint-box {
    background:rgba(103,232,249,.06); border:1px solid rgba(103,232,249,.2);
    border-radius:14px; padding:.85rem 1.1rem;
    font-size:.83rem; color:#a5f3fc; line-height:1.55; text-align:center;
    margin-bottom:1.4rem;
  }
  .hint-box strong { color:var(--cyan); }

  /* ── Presence banner ── */
  .presence-banner {
    background:rgba(251,191,36,.08); border:1px solid rgba(251,191,36,.3);
    border-radius:14px; padding:.85rem 1.1rem;
    font-size:.86rem; color:#fde68a; line-height:1.55; text-align:center;
    margin-bottom:1.4rem;
  }

  /* ── Legend ── */
  .legend {
    display:flex; gap:1.2rem; justify-content:center; flex-wrap:wrap;
    margin-bottom:1.6rem; font-size:.8rem; color:var(--text-muted); font-weight:600;
  }
  .legend span { display:flex; align-items:center; gap:6px; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; flex-shrink:0; }
  .dot-a { background:var(--green); box-shadow:0 0 6px var(--green); }
  .dot-t { background:var(--red);   box-shadow:0 0 6px var(--red); }

  /* ── Status toast ── */
  .toast {
    position:fixed; bottom:5rem; left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(15,15,58,.95); border:1px solid rgba(168,85,247,.4);
    border-radius:12px; padding:.6rem 1.4rem;
    font-size:.82rem; font-weight:700; color:#c4b5fd;
    opacity:0; pointer-events:none; z-index:500;
    transition:opacity .3s, transform .3s;
    white-space:nowrap;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ── Loading overlay ── */
  .loading-bar {
    position:fixed; top:0; left:0; right:0; height:3px; z-index:600;
    background:linear-gradient(90deg,var(--pink),var(--indigo),var(--cyan));
    transform:scaleX(0); transform-origin:left;
    transition:transform .4s ease; border-radius:0 2px 2px 0;
  }
  .loading-bar.active { transform:scaleX(1); }

  /* ── Admin bar ── */
  .admin-bar {
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:rgba(232,121,249,.07); border:1px solid rgba(232,121,249,.25);
    border-radius:12px; padding:.75rem 1rem; margin-bottom:1.4rem;
  }
  .admin-label { font-family:'Orbitron',sans-serif; font-size:.7rem; color:var(--pink); font-weight:700; letter-spacing:2px; }

  /* ── Gift grid ── */
  .gift-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:1rem; }

  /* ── Gift card ── */
  .gift-card {
    background:var(--card-bg); border:1px solid var(--card-border);
    border-radius:18px; padding:1.2rem 1.3rem;
    position:relative; overflow:hidden;
    transition:border-color .3s,transform .25s,background .3s;
    animation:cardIn .4s ease both;
  }
  @keyframes cardIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

  .gift-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg,var(--pink),var(--indigo),var(--cyan));
    opacity:0; transition:opacity .3s;
  }
  .gift-card:hover { border-color:rgba(168,85,247,.6); transform:translateY(-3px); }
  .gift-card:hover::before { opacity:1; }

  .gift-card.taken { background:rgba(248,113,113,.04); border-color:rgba(248,113,113,.2); }
  .gift-card.taken::before { background:linear-gradient(90deg,var(--red),#fb923c); opacity:1; }

  .card-top { display:flex; align-items:flex-start; gap:12px; margin-bottom:.55rem; }
  .gift-emoji { font-size:1.7rem; line-height:1; flex-shrink:0; margin-top:1px; }

  .gift-name { font-size:1rem; font-weight:800; color:var(--text); line-height:1.3; transition:color .3s; }
  .gift-card.taken .gift-name {
    text-decoration:line-through; text-decoration-color:var(--red);
    text-decoration-thickness:2px; color:var(--text-muted);
  }

  .gift-desc { font-size:.78rem; color:var(--text-muted); padding-left:2.1rem; margin-bottom:.6rem; line-height:1.45; }

  .card-badges { padding-left:2.1rem; margin-bottom:.8rem; }
  .badge {
    display:inline-flex; align-items:center; gap:4px;
    border-radius:20px; padding:3px 11px;
    font-size:.73rem; font-weight:700; margin-right:6px;
  }
  .badge-price     { background:rgba(129,140,248,.12); border:1px solid rgba(129,140,248,.3); color:var(--indigo); }
  .badge-available { background:rgba(74,222,128,.1);   border:1px solid rgba(74,222,128,.3);  color:var(--green); }
  .badge-taken     { background:rgba(248,113,113,.1);  border:1px solid rgba(248,113,113,.3); color:var(--red); }

  .card-actions {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding-top:.7rem; border-top:1px solid rgba(255,255,255,.06);
  }

  .btn-example {
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(103,232,249,.08); border:1px solid rgba(103,232,249,.3);
    color:var(--cyan); border-radius:9px; padding:6px 15px;
    font-size:.79rem; font-weight:700; cursor:pointer;
    text-decoration:none; font-family:'Nunito',sans-serif; transition:all .2s;
  }
  .btn-example:hover { background:rgba(103,232,249,.18); border-color:var(--cyan); color:#fff; transform:scale(1.04); }
  .btn-example.gone  { opacity:.3; pointer-events:none; }

  .ref-note { font-size:.7rem; color:#475569; font-style:italic; flex-basis:100%; margin-top:2px; }

  /* ── WhatsApp button ── */
  .btn-wa {
    position:relative; display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px; border-radius:50%; background:#25D366; border:none;
    cursor:pointer; flex-shrink:0; text-decoration:none;
    transition:transform .2s, box-shadow .2s;
    box-shadow:0 2px 8px rgba(37,211,102,.25);
  }
  .btn-wa:hover { transform:scale(1.12); box-shadow:0 0 16px rgba(37,211,102,.45); }
  .btn-wa svg { width:20px; height:20px; display:block; }
  .wa-tooltip {
    position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%);
    background:rgba(15,15,58,.97); border:1px solid rgba(37,211,102,.35);
    border-radius:8px; padding:5px 10px;
    font-size:.71rem; font-weight:700; color:#a7f3d0; font-family:'Nunito',sans-serif;
    white-space:nowrap; pointer-events:none;
    opacity:0; transition:opacity .2s;
  }
  .btn-wa:hover .wa-tooltip { opacity:1; }

  .badge-bringing { font-size:.76rem; color:var(--text-muted); font-style:italic; }

  .btn-admin {
    display:none; background:transparent;
    border:1px solid rgba(255,255,255,.1); color:var(--text-muted);
    border-radius:8px; padding:5px 11px; font-size:.75rem; font-weight:700;
    cursor:pointer; font-family:'Nunito',sans-serif; transition:all .2s;
    align-items:center; gap:4px;
  }
  .admin-mode .btn-admin { display:inline-flex; }
  .btn-admin:hover { color:var(--pink); border-color:var(--pink); }
  .btn-admin.del { margin-left:4px; }
  .btn-admin.del:hover { color:var(--red); border-color:var(--red); }
  .btn-admin.ml { margin-left:auto; }


  /* ── Modals ── */
  .overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.75); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    z-index:300; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .overlay.open { opacity:1; pointer-events:all; }

  .modal {
    background:linear-gradient(145deg,#0e0e38,#08082a);
    border:1px solid rgba(168,85,247,.35); border-radius:22px;
    padding:2rem 1.8rem; width:92%; max-width:430px;
    transform:scale(.9); transition:transform .25s;
    box-shadow:0 0 60px rgba(168,85,247,.15);
  }
  .overlay.open .modal { transform:scale(1); }

  .modal h3 { font-family:'Orbitron',sans-serif; font-size:.95rem; color:var(--pink); text-align:center; margin-bottom:1.4rem; letter-spacing:1px; }

  .field { margin-bottom:1rem; }
  .field label { display:block; font-size:.8rem; color:var(--text-muted); margin-bottom:5px; font-weight:700; }
  .field input {
    width:100%; background:rgba(255,255,255,.06);
    border:1px solid rgba(168,85,247,.25); border-radius:9px;
    color:var(--text); padding:9px 13px; font-size:.88rem;
    font-family:'Nunito',sans-serif; outline:none; transition:border-color .2s;
  }
  .field input:focus { border-color:var(--pink); }
  .field input::placeholder { color:#374151; }

  .modal-err { color:var(--red); font-size:.78rem; text-align:center; min-height:1.1rem; margin-bottom:.4rem; }

  .modal-btns { display:flex; gap:10px; margin-top:.4rem; }
  .modal-btns button {
    flex:1; padding:10px; border-radius:9px; font-size:.88rem; font-weight:800;
    cursor:pointer; font-family:'Nunito',sans-serif; transition:opacity .2s,transform .15s;
  }
  .modal-btns button:hover { opacity:.85; transform:scale(1.02); }
  .btn-ok { background:linear-gradient(135deg,var(--pink),var(--indigo)); border:none; color:#fff; }
  .btn-no { background:transparent; border:1px solid rgba(255,255,255,.15); color:var(--text-muted); }

  footer { text-align:center; margin-top:3.5rem; font-size:.75rem; color:#1e293b; letter-spacing:1.5px; text-transform:uppercase; }

  @media(max-width:520px) {
    .gift-grid { grid-template-columns:1fr; }
    h1 { font-size:1.5rem; }
    .party-details { gap:.8rem; font-size:.77rem; }
    .lang-toggle { top:.75rem; right:.75rem; gap:6px; padding:5px 10px; }
    .lang-btn { padding:2px 6px; font-size:.8rem; }
  }
</style>
</head>
<body>

<div class="loading-bar" id="loadingBar"></div>
<div id="starfield"></div>
<div class="nebula n1"></div>
<div class="nebula n2"></div>
<div class="nebula n3"></div>
<div class="toast" id="toast"></div>

<!-- Language toggle -->
<div class="lang-toggle">
  <button class="lang-btn active" data-lang="de" onclick="setLang('de')">DE</button>
  <span style="color:var(--text-muted);font-size:.7rem;">|</span>
  <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
</div>

<div class="container">
  <header>
    <div class="rocket-wrap" id="rocket">
      <lottie-player
        src="https://raw.githubusercontent.com/MohsinDev369/rocket-simple-animation/main/pages/data.json"
        background="transparent"
        speed="1"
        autoplay></lottie-player>
    </div>
    <h1 data-i18n="h1">Isha's Wunschliste</h1>
    <div class="tagline" data-i18n="tagline">Space Party · 9. Geburtstag</div>
    <div class="party-details">
      <span data-i18n="date">📅 9. Mai 2026</span>
      <span data-i18n="time">⏰ 15:00 – 19:00 Uhr</span>
      <span>📍 Ostendstraße 159, Nürnberg</span>
    </div>
  </header>

  <div class="divider">✦ ✦ ✦</div>

  <div class="presence-banner" data-i18n="presenceBanner">💛 Deine Anwesenheit ist das schönste Geschenk! Mitbringen ist freiwillig.</div>

  <div class="hint-box" data-i18n-html="hint"></div>

  <div class="legend">
    <span><span class="dot dot-a"></span><span data-i18n="legendAvail">Noch verfügbar</span></span>
    <span><span class="dot dot-t"></span><span data-i18n="legendTaken">Bereits vergeben</span></span>
  </div>

  <div class="admin-bar">
    <button class="btn-add" onclick="openAdd()" data-i18n="btnAdd">+ Geschenk hinzufügen</button>
  </div>

  <div class="gift-grid" id="giftGrid">
    <div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--text-muted);font-size:.9rem;" data-i18n="loading">
      🛸 Lade Wunschliste …
    </div>
  </div>

  <footer>Isha's Space Party 2026 · Nürnberg</footer>
</div>


<!-- Add-gift modal -->
<div class="overlay" id="addOverlay">
  <div class="modal">
    <h3 data-i18n="modalTitle">🎁 Neues Geschenk</h3>
    <div class="field"><label data-i18n="labelName">Name des Geschenks *</label>
      <input type="text" id="fName" data-i18n-placeholder="placeholderName" placeholder="z.B. LEGO Weltraum-Set"></div>
    <div class="field"><label data-i18n="labelEmoji">Emoji</label>
      <input type="text" id="fEmoji" placeholder="🎁" maxlength="2"></div>
    <div class="field"><label data-i18n="labelPrice">Preis (ca.)</label>
      <input type="text" id="fPrice" data-i18n-placeholder="placeholderPrice" placeholder="z.B. €25 – 35"></div>
    <div class="field"><label data-i18n="labelDesc">Beschreibung (optional)</label>
      <input type="text" id="fDesc" data-i18n-placeholder="placeholderDesc" placeholder="z.B. Alter 7+, 500 Teile"></div>
    <div class="field"><label data-i18n="labelUrl">Beispiel-Link (URL)</label>
      <input type="text" id="fUrl" placeholder="https://…"></div>
    <div class="modal-btns">
      <button class="btn-no" onclick="closeAdd()" data-i18n="btnCancel">Abbrechen</button>
      <button class="btn-ok" onclick="addGift()" data-i18n="btnSubmit">Hinzufügen</button>
    </div>
  </div>
</div>

    toastLoggedOut: "Logged out",
    waTooltip: "I'll bring this! – Send message to Mama",
    badgeBringing: "✓ Being brought"
  }
};

/* ─── State ─── */
let lang = "de";
let gifts = [];

/* ─── Language ─── */
function setLang(newLang) {
  lang = newLang;
  document.documentElement.lang = lang;
  document.title = T[lang].title;

  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = T[lang][el.getAttribute("data-i18n")];
  });

  document.querySelectorAll("[data-i18n-html]").forEach(el => {
    el.innerHTML = T[lang][el.getAttribute("data-i18n-html")];
  });

  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    el.placeholder = T[lang][el.getAttribute("data-i18n-placeholder")];
  });

  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
  });

  render();
}

/* ─── API helpers ─── */
async function loadGifts() {
  setLoading(true);
  try {
    const res = await fetch("/api/get-gifts");
    const data = await res.json();
    gifts = data.gifts;
  } catch(e) {
    showToast(T[lang].toastLoadFail);
  } finally {
    setLoading(false);
    render();
  }
}

async function saveGifts() {
  setLoading(true);
  try {
    const res = await fetch("/api/update-gifts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ gifts })
    });
    if (!res.ok) throw new Error(await res.text());
    showToast(T[lang].toastSaved);
  } catch(e) {
    showToast(T[lang].toastSaveFail);
  } finally {
    setLoading(false);
  }
}

/* ─── Render ─── */
function render() {
  const grid = document.getElementById("giftGrid");
  grid.innerHTML = "";
  gifts.forEach((g, i) => {
    const card = document.createElement("div");
    card.className = "gift-card" + (g.taken ? " taken" : "") + " admin-mode";
    card.style.animationDelay = (i * 0.06) + "s";

    const emojiPart = g.emoji ? ` ${g.emoji}` : "";
    const waMsg = lang === "de"
      ? `Hallo! Ich bringe Isha ein ${g.name}${emojiPart} zur Space Party am 9. Mai mit! 🚀`
      : `Hello! I'll bring Isha a ${g.name}${emojiPart} to the Space Party on May 9! 🚀`;
    const waUrl = `https://wa.me/919886388127?text=${encodeURIComponent(waMsg)}`;
    const waIcon = `<svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>`;

    card.innerHTML = `
      <div class="card-top">
        <span class="gift-emoji">${g.emoji || "🎁"}</span>
        <span class="gift-name">${g.name}</span>
      </div>
      ${g.desc ? `<div class="gift-desc">${g.desc}</div>` : ""}
      <div class="card-badges">
        <span class="badge badge-price">💶 ${g.price}</span>
        <span class="badge ${g.taken ? "badge-taken" : "badge-available"}">
          ${g.taken ? T[lang].badgeTaken : T[lang].badgeAvail}
        </span>
      </div>
      <div class="card-actions">
        <a class="btn-example ${g.taken ? "gone" : ""}"
           href="${g.url}" target="_blank" rel="noopener">
          ${T[lang].btnExample}
        </a>
        ${g.taken
          ? `<span class="badge-bringing">${T[lang].badgeBringing}</span>`
          : `<a class="btn-wa" href="${waUrl}" target="_blank" rel="noopener">
               <span class="wa-tooltip">${T[lang].waTooltip}</span>
               ${waIcon}
             </a>`
        }
        ${!g.taken ? `<span class="ref-note">${T[lang].refNote}</span>` : ""}
        <button class="btn-admin ml" onclick="toggleTaken(${g.id})">
          ${g.taken ? T[lang].btnUnmark : T[lang].btnMark}
        </button>
        <button class="btn-admin del" onclick="deleteGift(${g.id})">🗑</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

/* ─── Admin actions ─── */
async function toggleTaken(id) {
  const g = gifts.find(x => x.id === id);
  if (!g) return;
  g.taken = !g.taken;
  render();
  await saveGifts();
}

async function deleteGift(id) {
  if (!confirm(T[lang].confirmDelete)) return;
  gifts = gifts.filter(x => x.id !== id);
  render();
  await saveGifts();
}

/* ─── Add gift ─── */
function openAdd() { document.getElementById("addOverlay").classList.add("open"); }
function closeAdd() {
  document.getElementById("addOverlay").classList.remove("open");
  ["fName","fEmoji","fPrice","fDesc","fUrl"].forEach(id => document.getElementById(id).value = "");
}
async function addGift() {
  const name = document.getElementById("fName").value.trim();
  if (!name) { document.getElementById("fName").focus(); return; }
  gifts.push({
    id: Date.now(),
    emoji: document.getElementById("fEmoji").value.trim() || "🎁",
    name,
    desc: document.getElementById("fDesc").value.trim(),
    price: document.getElementById("fPrice").value.trim() || "—",
    url: document.getElementById("fUrl").value.trim() || "#",
    taken: false
  });
  closeAdd();
  render();
  await saveGifts();
}

/* ─── UI helpers ─── */
function setLoading(on) {
  document.getElementById("loadingBar").classList.toggle("active", on);
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
}

/* ─── Stars ─── */
(function() {
  const sf = document.getElementById("starfield");
  for (let i = 0; i < 120; i++) {
    const s = document.createElement("div");
    s.className = "star";
    const sz = Math.random() * 2.2 + 0.4;
    s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${(2+Math.random()*5).toFixed(1)}s;--delay:${(Math.random()*5).toFixed(1)}s`;
    sf.appendChild(s);
  }
})();

/* ─── Init ─── */
setLang('de');
loadGifts();
</script>
</body>
</html>
