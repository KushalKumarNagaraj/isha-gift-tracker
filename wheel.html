<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wheel of Names – Isha's Space Party 🚀</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --space-deep:   #05051a;
    --purple:       #a855f7;
    --purple-light: #c084fc;
    --pink:         #e879f9;
    --cyan:         #67e8f9;
    --indigo:       #818cf8;
    --green:        #4ade80;
    --red:          #f87171;
    --text:         #e2e8f0;
    --text-muted:   #94a3b8;
    --card-bg:      rgba(255,255,255,0.04);
    --card-border:  rgba(168,85,247,0.25);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--space-deep);
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  #starfield {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 15% 15%, #110a2e 0%, #05051a 55%, #0a0d2e 100%);
    z-index: 0; pointer-events: none;
  }
  .star {
    position: absolute; border-radius: 50%; background: #fff;
    animation: twinkle var(--d,3s) ease-in-out infinite;
    animation-delay: var(--delay,0s);
  }
  @keyframes twinkle {
    0%,100% { opacity:.15; transform:scale(1); }
    50%      { opacity:1;   transform:scale(1.5); }
  }

  .nebula { position:fixed; border-radius:50%; filter:blur(80px); pointer-events:none; z-index:0; }
  .n1 { width:500px; height:500px; background:rgba(168,85,247,.07);  top:-150px; right:-150px; }
  .n2 { width:400px; height:400px; background:rgba(103,232,249,.05); bottom:-100px; left:-100px; }
  .n3 { width:300px; height:300px; background:rgba(232,121,249,.06); top:40%; left:30%; }

  .container {
    position: relative; z-index: 1;
    max-width: 980px; margin: 0 auto;
    padding: 2.5rem 1.5rem 5rem;
  }

  /* ── Back link ── */
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--text-muted); font-size: .82rem; font-weight: 700;
    text-decoration: none; letter-spacing: 1px;
    transition: color .2s;
    margin-bottom: 1.5rem;
  }
  .back-link:hover { color: var(--cyan); }

  /* ── Header ── */
  header { text-align: center; padding-bottom: 2rem; }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.6rem, 5vw, 2.6rem); font-weight: 900;
    letter-spacing: 3px; text-transform: uppercase;
    background: linear-gradient(135deg, #f0abfc, #818cf8 40%, #67e8f9);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: .35rem; line-height: 1.15;
  }

  .tagline { font-size: .95rem; color: var(--indigo); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }

  /* ── Main layout ── */
  .main-layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 2rem;
    align-items: start;
  }

  /* ── Wheel area ── */
  .wheel-area { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }

  .wheel-wrap {
    position: relative;
    display: inline-block;
  }

  canvas {
    display: block;
    width: 100%;
    max-width: 480px;
    height: auto;
    border-radius: 50%;
    filter: drop-shadow(0 0 32px rgba(168,85,247,.35)) drop-shadow(0 0 12px rgba(103,232,249,.15));
  }

  /* pointer triangle at top */
  .pointer {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 28px solid var(--pink);
    filter: drop-shadow(0 0 8px var(--pink));
    z-index: 2;
  }

  /* ── Spin button ── */
  .btn-spin {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem; font-weight: 900;
    letter-spacing: 3px; text-transform: uppercase;
    background: linear-gradient(135deg, var(--pink), var(--indigo));
    border: none; color: #fff;
    padding: .9rem 3rem; border-radius: 50px;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s, opacity .2s;
    box-shadow: 0 4px 24px rgba(232,121,249,.35);
  }
  .btn-spin:hover:not(:disabled) {
    transform: scale(1.06);
    box-shadow: 0 6px 32px rgba(232,121,249,.55);
  }
  .btn-spin:disabled { opacity: .4; cursor: not-allowed; }

  /* ── Names panel ── */
  .names-panel {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 1.4rem 1.2rem;
    display: flex; flex-direction: column; gap: 1rem;
  }

  .panel-title {
    font-family: 'Orbitron', sans-serif;
    font-size: .75rem; font-weight: 700;
    color: var(--purple-light); letter-spacing: 2px; text-transform: uppercase;
  }

  .add-row {
    display: flex; gap: 8px;
  }
  .name-input {
    flex: 1;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(168,85,247,.25);
    border-radius: 9px;
    color: var(--text);
    padding: 8px 12px;
    font-size: .88rem; font-family: 'Nunito', sans-serif;
    outline: none; transition: border-color .2s;
  }
  .name-input:focus { border-color: var(--pink); }
  .name-input::placeholder { color: #374151; }

  .btn-add {
    background: linear-gradient(135deg, var(--purple), var(--indigo));
    border: none; color: #fff;
    padding: 8px 16px; border-radius: 9px;
    font-size: .88rem; font-weight: 800; font-family: 'Nunito', sans-serif;
    cursor: pointer; transition: opacity .2s, transform .15s;
    white-space: nowrap;
  }
  .btn-add:hover { opacity: .85; transform: scale(1.04); }

  /* ── Name list ── */
  .name-list {
    list-style: none;
    display: flex; flex-direction: column; gap: 6px;
    max-height: 340px; overflow-y: auto;
    padding-right: 4px;
  }
  .name-list::-webkit-scrollbar { width: 4px; }
  .name-list::-webkit-scrollbar-track { background: transparent; }
  .name-list::-webkit-scrollbar-thumb { background: rgba(168,85,247,.3); border-radius: 2px; }

  .name-item {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 9px; padding: 7px 10px;
    animation: slideIn .25s ease both;
  }
  @keyframes slideIn { from{opacity:0;transform:translateX(10px)} to{opacity:1;transform:translateX(0)} }

  .name-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .name-text {
    flex: 1; font-size: .85rem; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .btn-remove {
    background: transparent; border: none;
    color: var(--text-muted); font-size: 1rem;
    cursor: pointer; padding: 0 2px; line-height: 1;
    transition: color .2s;
    flex-shrink: 0;
  }
  .btn-remove:hover { color: var(--red); }

  .empty-note {
    font-size: .8rem; color: var(--text-muted); text-align: center;
    padding: 1rem 0; font-style: italic;
  }

  .count-note {
    font-size: .75rem; color: var(--text-muted); text-align: right;
  }

  /* ── Winner overlay ── */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.8); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    z-index: 300; opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: linear-gradient(145deg, #0e0e38, #08082a);
    border: 1px solid rgba(168,85,247,.45); border-radius: 24px;
    padding: 2.4rem 2rem; width: 92%; max-width: 400px;
    text-align: center;
    transform: scale(.85); transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    box-shadow: 0 0 80px rgba(232,121,249,.25);
  }
  .overlay.open .modal { transform: scale(1); }

  .winner-emoji { font-size: 3.5rem; margin-bottom: .5rem; display: block; }

  .modal-title {
    font-family: 'Orbitron', sans-serif;
    font-size: .8rem; font-weight: 700;
    color: var(--text-muted); letter-spacing: 3px; text-transform: uppercase;
    margin-bottom: .5rem;
  }

  .winner-name {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.4rem, 6vw, 2rem); font-weight: 900;
    background: linear-gradient(135deg, #f0abfc, #818cf8 40%, #67e8f9);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 1.8rem; word-break: break-word;
    animation: popIn .4s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes popIn { from{opacity:0;transform:scale(.6)} to{opacity:1;transform:scale(1)} }

  .modal-actions { display: flex; gap: 10px; justify-content: center; }

  .btn-close {
    background: transparent; border: 1px solid rgba(255,255,255,.15);
    color: var(--text-muted); border-radius: 10px;
    padding: 10px 24px; font-size: .88rem; font-weight: 800;
    cursor: pointer; font-family: 'Nunito', sans-serif;
    transition: all .2s;
  }
  .btn-close:hover { border-color: var(--text-muted); color: var(--text); }

  .btn-again {
    background: linear-gradient(135deg, var(--pink), var(--indigo));
    border: none; color: #fff; border-radius: 10px;
    padding: 10px 24px; font-size: .88rem; font-weight: 800;
    cursor: pointer; font-family: 'Nunito', sans-serif;
    transition: opacity .2s, transform .15s;
  }
  .btn-again:hover { opacity: .85; transform: scale(1.04); }

  /* ── Confetti ── */
  .confetti-piece {
    position: fixed; width: 10px; height: 10px;
    z-index: 400; pointer-events: none;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity:1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity:0; }
  }

  footer { text-align: center; margin-top: 3.5rem; font-size: .75rem; color: #1e293b; letter-spacing: 1.5px; text-transform: uppercase; }

  @media (max-width: 700px) {
    .main-layout { grid-template-columns: 1fr; }
    .name-list { max-height: 220px; }
    canvas { max-width: 340px; }
  }
</style>
</head>
<body>

<div id="starfield"></div>
<div class="nebula n1"></div>
<div class="nebula n2"></div>
<div class="nebula n3"></div>

<div class="container">
  <a href="index.html" class="back-link">← Back to Wish List</a>

  <header>
    <h1>Wheel of Names</h1>
    <div class="tagline">Spin the galaxy · Pick a winner</div>
  </header>

  <div class="main-layout">
    <!-- Wheel -->
    <div class="wheel-area">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="600" height="600"></canvas>
      </div>
      <button class="btn-spin" id="spinBtn" onclick="spin()">🚀 SPIN!</button>
    </div>

    <!-- Names panel -->
    <div class="names-panel">
      <div class="panel-title">Names</div>

      <div class="add-row">
        <input class="name-input" id="nameInput" type="text" placeholder="Enter a name…" maxlength="24">
        <button class="btn-add" onclick="addName()">Add</button>
      </div>

      <ul class="name-list" id="nameList"></ul>
      <div class="count-note" id="countNote"></div>
    </div>
  </div>

  <footer>Isha's Space Party 2026 · Nürnberg</footer>
</div>

<!-- Winner modal -->
<div class="overlay" id="winnerOverlay">
  <div class="modal">
    <span class="winner-emoji">🏆</span>
    <div class="modal-title">Winner!</div>
    <div class="winner-name" id="winnerName"></div>
    <div class="modal-actions">
      <button class="btn-close" onclick="closeWinner()">Close</button>
      <button class="btn-again" onclick="closeWinner(); setTimeout(spin, 200)">Spin Again</button>
    </div>
  </div>
</div>

<script>
const COLORS = [
  '#a855f7','#e879f9','#67e8f9','#818cf8',
  '#4ade80','#fbbf24','#c084fc','#fb923c',
  '#34d399','#f472b6','#60a5fa','#f87171',
  '#a78bfa','#86efac','#7dd3fc','#fca5a5'
];

let names = ['Alice','Bob','Charlie','Diana','Eve','Frank'];
let currentAngle = -Math.PI / 2; // start so first slice top-centers
let spinning = false;
let animFrame = null;

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const SIZE = canvas.width;
const CX = SIZE / 2;
const CY = SIZE / 2;
const R = CX - 16;

/* ── Draw ── */
function drawWheel() {
  ctx.clearRect(0, 0, SIZE, SIZE);

  if (names.length === 0) {
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(168,85,247,0.06)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(168,85,247,0.3)';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = '#94a3b8';
    ctx.font = 'bold 18px Nunito';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Add names to spin!', CX, CY);
    return;
  }

  const n = names.length;
  const sliceAngle = (Math.PI * 2) / n;

  // Draw slices
  for (let i = 0; i < n; i++) {
    const start = currentAngle + i * sliceAngle;
    const end = start + sliceAngle;
    const mid = start + sliceAngle / 2;

    // Slice fill
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, start, end);
    ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length];
    ctx.fill();

    // Slice border
    ctx.strokeStyle = 'rgba(5,5,26,.7)';
    ctx.lineWidth = n > 20 ? 1 : 2;
    ctx.stroke();

    // Text
    if (n <= 30) {
      ctx.save();
      ctx.translate(CX, CY);
      ctx.rotate(mid);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      const fontSize = Math.max(10, Math.min(18, Math.floor(R * sliceAngle * 0.38)));
      ctx.font = `bold ${fontSize}px Nunito`;
      ctx.fillStyle = '#fff';
      ctx.shadowColor = 'rgba(0,0,0,.6)';
      ctx.shadowBlur = 4;
      const maxLen = Math.max(4, Math.floor(R * sliceAngle / (fontSize * 0.65)));
      const label = names[i].length > maxLen ? names[i].slice(0, maxLen - 1) + '…' : names[i];
      ctx.fillText(label, R - 14, 0);
      ctx.restore();
    }
  }

  // Outer ring glow
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(168,85,247,.7)';
  ctx.lineWidth = 5;
  ctx.shadowColor = 'rgba(168,85,247,.5)';
  ctx.shadowBlur = 12;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Inner decorative ring
  ctx.beginPath();
  ctx.arc(CX, CY, R * 0.13, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,.15)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Center circle
  ctx.beginPath();
  ctx.arc(CX, CY, R * 0.1, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, R * 0.1);
  grad.addColorStop(0, '#f0abfc');
  grad.addColorStop(1, '#6366f1');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Star icon in center
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.round(R * 0.08)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('★', CX, CY);
}

/* ── Spin ── */
function spin() {
  if (spinning) return;
  if (names.length < 2) {
    alert('Add at least 2 names to spin!');
    return;
  }

  spinning = true;
  document.getElementById('spinBtn').disabled = true;

  const startAngle = currentAngle;
  const extraSpins = (Math.floor(Math.random() * 5) + 5) * Math.PI * 2;
  const randomOffset = Math.random() * Math.PI * 2;
  const totalRotation = extraSpins + randomOffset;
  const duration = 4000 + Math.random() * 2000;
  const startTime = performance.now();

  function easeOut(t) {
    return 1 - Math.pow(1 - t, 4);
  }

  function animate(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed / duration, 1);
    currentAngle = startAngle + totalRotation * easeOut(t);
    drawWheel();

    if (t < 1) {
      animFrame = requestAnimationFrame(animate);
    } else {
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
      showWinner();
    }
  }

  animFrame = requestAnimationFrame(animate);
}

/* ── Winner ── */
function getWinner() {
  const n = names.length;
  const sliceAngle = (Math.PI * 2) / n;
  // Pointer is at top = -PI/2. Find which slice covers that angle.
  const pointerAngle = -Math.PI / 2;
  const rel = ((pointerAngle - currentAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  const index = Math.floor(rel / sliceAngle) % n;
  return names[index];
}

function showWinner() {
  const winner = getWinner();
  document.getElementById('winnerName').textContent = winner;
  document.getElementById('winnerOverlay').classList.add('open');
  launchConfetti();
}

function closeWinner() {
  document.getElementById('winnerOverlay').classList.remove('open');
}

/* ── Confetti ── */
function launchConfetti() {
  const colors = ['#f0abfc','#818cf8','#67e8f9','#4ade80','#fbbf24','#f472b6'];
  for (let i = 0; i < 80; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const color = colors[Math.floor(Math.random() * colors.length)];
    const size = Math.random() * 10 + 6;
    const left = Math.random() * 100;
    const delay = Math.random() * 0.8;
    const dur = Math.random() * 1.5 + 1.5;
    const shape = Math.random() > 0.5 ? '50%' : '2px';
    el.style.cssText = `
      left:${left}vw; top:0;
      width:${size}px; height:${size}px;
      background:${color};
      border-radius:${shape};
      animation-duration:${dur}s;
      animation-delay:${delay}s;
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (dur + delay) * 1000 + 100);
  }
}

/* ── Name management ── */
function addName() {
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  if (names.includes(name)) { input.select(); return; }
  names.push(name);
  input.value = '';
  input.focus();
  renderList();
  drawWheel();
}

function removeName(i) {
  names.splice(i, 1);
  renderList();
  drawWheel();
}

function renderList() {
  const list = document.getElementById('nameList');
  const count = document.getElementById('countNote');

  if (names.length === 0) {
    list.innerHTML = '<li class="empty-note">No names yet — add some above!</li>';
    count.textContent = '';
    return;
  }

  list.innerHTML = names.map((name, i) => `
    <li class="name-item" style="animation-delay:${i * 0.04}s">
      <span class="name-dot" style="background:${COLORS[i % COLORS.length]}"></span>
      <span class="name-text" title="${escHtml(name)}">${escHtml(name)}</span>
      <button class="btn-remove" onclick="removeName(${i})" title="Remove">×</button>
    </li>
  `).join('');

  count.textContent = `${names.length} name${names.length === 1 ? '' : 's'}`;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Stars ── */
(function() {
  const sf = document.getElementById('starfield');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 2.2 + 0.4;
    s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${(2+Math.random()*5).toFixed(1)}s;--delay:${(Math.random()*5).toFixed(1)}s`;
    sf.appendChild(s);
  }
})();

/* ── Keyboard ── */
document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addName();
});

/* ── Init ── */
renderList();
drawWheel();
</script>
</body>
</html>
